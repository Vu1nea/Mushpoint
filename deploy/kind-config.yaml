# Local cluster for the runbook (docs/k8s-runbook.md): one node, host port 8080
# mapped to ingress-nginx, so the app is at http://localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mushpoint
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
