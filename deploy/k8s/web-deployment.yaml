apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mushpoint
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: mushpoint-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /robots.txt, port: http }
            periodSeconds: 10
          # Ready once the mounted runtime config is being served.
          readinessProbe:
            httpGet: { path: /config.json, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            # A subPath mount does not follow ConfigMap edits: after changing
            # web-config, run `kubectl -n mushpoint rollout restart deploy/web`.
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            # nginx-unprivileged keeps its pid and temp files here.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: web-config }
        - name: tmp
          emptyDir: {}
