apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mushpoint
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: api }
    spec:
      # The API drains in-flight requests on SIGTERM and gives up after 20 s
      # (server/src/shutdown.ts), inside this 30 s grace period.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mushpoint-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef: { name: api-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: api-secrets, key: DATABASE_URL }
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef: { name: api-secrets, key: SUPABASE_SERVICE_KEY }
          # Process alive: restart it if it stops answering.
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Database reachable: keep the pod out of the Service until it is.
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give the ingress time to drop this pod before SIGTERM arrives.
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
