# EXAMPLE ONLY: kept outside deploy/k8s so `kubectl apply -f deploy/k8s` skips it. The runbook
# creates the Secret from a local env file instead. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: mushpoint
type: Opaque
stringData:
  # The API connects as mushpoint_app (NOBYPASSRLS), so row-level security applies.
  DATABASE_URL: postgres://mushpoint_app:CHANGE_ME@db.your-project-ref.supabase.co:5432/postgres
  # Supabase secret key (sb_secret_...): account deletion and image storage.
  SUPABASE_SERVICE_KEY: CHANGE_ME
  # Migrations only: the database owner, and the password to set for mushpoint_app.
  MIGRATE_DATABASE_URL: postgres://postgres:CHANGE_ME@db.your-project-ref.supabase.co:5432/postgres
  MUSHPOINT_APP_PASSWORD: CHANGE_ME
