# Included in every location: nginx drops inherited add_header directives as
# soon as a location declares its own, so each one re-includes this file.
# csp.conf is generated at image build from the <meta> CSP SvelteKit writes into
# index.html (it holds this build's script hash), plus frame-ancestors.
include /etc/nginx/snippets/csp.conf;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Only honoured over HTTPS; TLS terminates at the ingress in front of this server.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
