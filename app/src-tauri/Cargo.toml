[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-opener = "2"
# Used directly (not just transitively via tauri-plugin-sql) to baseline a
# pre-existing database into sqlx's migration-tracking scheme — see db_baseline.rs.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
sha2 = "0.10"

[dev-dependencies]
futures-core = "0.3"
